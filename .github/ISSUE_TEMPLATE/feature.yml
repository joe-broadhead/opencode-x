name: Feature request
description: A capability, a source or a change the X plugin should make.
title: "feat: "
body:
  - type: markdown
    attributes:
      value: |
        A new capability starts in the manifest and needs a handler, tests and a recorded fixture. Read AGENTS.md
        before you open the pull request. X's own tools are pass-through `mcp:<tool>` rows: ask for one only when X's
        MCP server lists it.
  - type: dropdown
    id: kind
    attributes:
      label: What kind of capability
      options:
        - A read method
        - A write method (a pass-through X tool)
        - An events source (mentions, bookmarks, timeline)
        - An account profile field or sign-in change
        - Documentation or layout
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What a person cannot do today, and why this plugin is the right owner.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The proposal
      description: The method or source, its class, the X tools it needs, and what its answer looks like.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Risk and confirmation
      description: For a write, say whom it reaches and how it is confirmed (an ask, or an action grant). For a read, say what it reads and what it costs.
    validations:
      required: false
