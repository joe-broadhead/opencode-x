name: CI

# One job, named ci: the org ruleset requires a check with that name, and the merge bot merges only on a green ci. It
# runs the whole gate, so the required check covers lint, typecheck, build, tests, the pack check, conformance, docs
# drift, the forbidden scan and the workflows themselves.
#
# It runs locally too: npm ci --ignore-scripts && npm run check

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: boxd-public
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # The tests run on Bun (bun:test); Node alone cannot execute them.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
          no-cache: true
      - name: Fetch the contract over HTTPS
        # The contract is a public repository, and npm records its GitHub dependency over ssh. A runner has no key.
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      # The workflows are tools too: a YAML file GitHub refuses fails the whole run. actionlint parses them as
      # workflows, not as YAML.
      - name: Install actionlint
        run: |
          set -euo pipefail
          version=1.7.12
          base="https://github.com/rhysd/actionlint/releases/download/v${version}"
          curl -sSfLO "${base}/actionlint_${version}_linux_amd64.tar.gz"
          curl -sSfLO "${base}/actionlint_${version}_checksums.txt"
          grep " actionlint_${version}_linux_amd64.tar.gz$" "actionlint_${version}_checksums.txt" | sha256sum -c -
          tar xzf "actionlint_${version}_linux_amd64.tar.gz" actionlint
          mkdir -p "$RUNNER_TEMP/bin"
          mv actionlint "$RUNNER_TEMP/bin/actionlint"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/actionlint" --version
      - run: npm ci --ignore-scripts
      # A tag install ships the committed dist/, so a stale bundle is the code that would run.
      - name: The committed bundle is current
        run: npm run bundle && git diff --exit-code dist/
      - run: actionlint
      - run: npm run check
      - run: npx plugin-kit docs --check
