name: Release

# A tag v<package.json version> on a master commit whose CI passed creates the GitHub Release. Releases are not
# published to npm: a consumer pins the tag, github:we-the-rebel-alliance/x-plugin#v<version>, and dist/ is committed,
# so that install runs no build. Only the owner decides a release; an agent never pushes a tag on its own.
#
# Least privilege: `build` runs the repository's code and holds no write token; `publish` runs no repository code,
# checks the files against SHA256SUMS, and creates the Release with contents: write.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the release files
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # The tests run on Bun (bun:test); Node alone cannot execute them.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
          no-cache: true
      - name: Fetch the contract over HTTPS
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - run: npm ci --ignore-scripts
      - name: The committed bundle is current
        run: npm run bundle && git diff --exit-code dist/
      - run: npm run check
      - name: The tag names this package's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "$TAG"
      - name: Pack the release files
        run: |
          set -euo pipefail
          mkdir -p release
          npx plugin-kit check --json > release/conformance.json
          npm pack --pack-destination release
          sha256sum release/*.tgz release/conformance.json > release/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error

  publish:
    name: Publish the GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Check the files against SHA256SUMS
        working-directory: release
        run: sha256sum -c SHA256SUMS
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$TAG" release/*.tgz release/conformance.json release/SHA256SUMS --repo "$REPO" --verify-tag --title "$TAG" --generate-notes
